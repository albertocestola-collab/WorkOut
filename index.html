<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Allenamento</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Allenamento">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: una colonna su telefono, due colonne su PC. Arancio = lavoro, blu = recupero, rosso = solo dolori e cose da cancellare. */
:root{
  --bg:#F4F1EE; --surface:#FFFFFF; --surface-2:#F7F3EF; --ink:#1E1814; --muted:#6B5F57; --line:#E5DDD5;
  --accent:#C2410C; --accent-ink:#FFFFFF; --accent-soft:#FDE6D8;
  --rest:#1F6FB2; --rest-soft:#DCEBF8;
  --ok:#1E7F4F; --ok-soft:#D9F0E3;
  --warn:#946000; --warn-soft:#FBEBCF; --urgent:#B42318; --urgent-soft:#F9DEDA;
  --h0:#ECE5DF; --h1:#FBD9C3; --h2:#F6A876; --h3:#E36E2B; --h4:#C2410C; --h-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(30,24,20,.05),0 6px 18px rgba(30,24,20,.07);
  --backdrop:rgba(20,14,10,.45);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --r-s:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#14110F; --surface:#1F1A17; --surface-2:#28221E; --ink:#F2ECE7; --muted:#A99C92; --line:#3A312B;
  --accent:#FF8A3D; --accent-ink:#2A0E00; --accent-soft:#43230F;
  --rest:#6CB4F0; --rest-soft:#16293A;
  --ok:#5FD39A; --ok-soft:#143326;
  --warn:#F0AB45; --warn-soft:#3A2B12; --urgent:#F97066; --urgent-soft:#3F1E1B;
  --h0:#2B2420; --h1:#4A2A16; --h2:#7A3A14; --h3:#C25A1C; --h4:#FF8A3D; --h-ink:#2A0E00;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --backdrop:rgba(0,0,0,.6);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.noscroll{overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

.app{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(160px + env(safe-area-inset-bottom,0px))}

/* navigazione */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:0;padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.nav button{flex:1;min-width:0;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--muted);font-size:11.5px;font-weight:700;white-space:nowrap}
.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.brand{display:none}
@media (min-width:900px){
  .app{padding-bottom:48px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding-block:10px;margin-bottom:6px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px}
  .brand img{width:30px;height:30px;border-radius:8px}
  .nav{position:static;border:1px solid var(--line);border-radius:14px;padding:4px;background:var(--surface);gap:2px}
  .nav button{flex-direction:row;gap:7px;padding:8px 12px;font-size:15px;max-width:none}
  .nav button svg{width:19px;height:19px}
}

.banner{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--warn-soft);color:var(--ink);border-radius:var(--r-s);padding:10px 12px 10px 14px;margin-bottom:12px;font-size:15px}
.banner button{flex:none;font-weight:700;color:var(--warn);padding:2px 4px}

/* card e sezioni */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-head h2{font-size:20px;font-weight:800}
.page-h{font-size:30px;font-weight:800}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:14px}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}
.note{font-size:14px;color:var(--muted);max-width:65ch}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--urgent-soft);color:var(--urgent)}
.empty{padding:14px;border:2px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);flex:none}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:disabled{opacity:.35;cursor:default}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--surface-2);color:var(--ink);text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{color:var(--urgent)}
.btn.armed{background:var(--urgent);color:#fff}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* oggi */
.hero{display:flex;align-items:center;gap:12px;padding-block:6px 4px}
.hero .dn{flex:1;min-width:0}
.hero h1{font-size:clamp(25px,6vw,36px);font-weight:800;line-height:1.05}
.hero .sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px;color:var(--muted);font-size:15px}
.today{border-top:6px solid var(--accent)}
.today h2{font-size:clamp(24px,6vw,30px);font-weight:800;line-height:1.1;margin:4px 0 6px}
.today .exs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.today .exs span{background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:14px}
.startbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:78px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:clamp(17px,4.6vw,22px);font-weight:800;padding:0 12px;box-shadow:0 10px 26px rgba(194,65,12,.32)}
.startbtn svg{width:26px;height:26px;fill:currentColor}
.startbtn.resume{background:var(--rest);color:#fff;box-shadow:none}
.easy2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.easy2 .btn{min-height:56px;flex-direction:column;gap:0;line-height:1.2;padding:8px}
.easy2 .btn small{font-weight:400;font-size:12.5px;color:var(--muted)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:10px;min-width:0}
.wd .l{font-size:12px;font-weight:700;color:var(--muted)}
.wd .o{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.wd .o svg{width:17px;height:17px;stroke:var(--accent-ink);fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.wd.plan .o{box-shadow:inset 0 0 0 2.5px var(--accent)}
.wd.done .o{background:var(--accent)}
.wd.light .o{background:var(--h2)}
.wd.miss .o{box-shadow:inset 0 0 0 2px var(--line)}
.wd.is-today{background:var(--accent-soft)}
.wd.is-today .l{color:var(--accent)}
.hint-card{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:12px}
.hint-card .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.hint-card .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hint-card .tx{flex:1;min-width:0}
.hint-card .btnrow{margin-top:8px}
.safety{font-size:13.5px;color:var(--muted);display:flex;gap:10px;align-items:flex-start;padding:4px 2px}
.safety button{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* liste */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;background:var(--surface-2);border-radius:12px;min-height:56px}
.row .txt{flex:1;min-width:0}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .m{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row > svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.2;flex:none}
.row .mini{flex:none;width:44px;height:44px;border-radius:10px;background:var(--surface);color:var(--accent);display:grid;place-items:center}
.row .mini svg{width:40px;height:40px}
.row.dis{opacity:.55}
.dayblock{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.dayblock:first-of-type{border-top:0;padding-top:0;margin-top:0}
.dayblock .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.dayblock h3{font-size:19px;font-weight:800}
.why{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:15px}

/* chip e scelte */
.chipset{display:flex;gap:6px;flex-wrap:wrap}
.chipset label{position:relative}
.chipset input{position:absolute;opacity:0;inset:0;margin:0}
.chipset span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:14.5px;color:var(--muted)}
.chipset input:checked+span{background:var(--accent);color:var(--accent-ink)}
.chipset input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;min-height:38px;padding:0 13px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.scroll-x{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll-x::-webkit-scrollbar{display:none}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px;border-radius:14px;background:var(--surface-2);min-height:76px;position:relative}
.choice b{font-size:17px}
.choice span{font-size:13.5px;color:var(--muted)}
.choice.wide{grid-column:1/-1}
.choice[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2.5px var(--accent)}
.choice[aria-pressed="true"] b{color:var(--accent)}
.seg{display:inline-flex;background:var(--surface);border-radius:12px;padding:4px;box-shadow:var(--shadow);flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:9px;font-weight:700;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg.flat{box-shadow:none;background:var(--surface-2)}
.seg.wide{display:flex;width:100%;flex-wrap:nowrap}
.seg.wide button{flex:1;padding:6px 4px;min-width:0}
@media (min-width:900px){.seg.wide{width:auto}.seg.wide button{padding:6px 14px}}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{position:relative}
.days input{position:absolute;opacity:0;inset:0;margin:0}
.days span{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--surface-2);font-weight:700;color:var(--muted)}
.days input:checked+span{background:var(--accent);color:var(--accent-ink)}
.days input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}

/* form */
.form{display:flex;flex-direction:column;gap:14px}
.form label.l,.form .l{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.form .hint,.hint{font-weight:400;font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.field,select,textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px;width:100%}
.field:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.field.sm{max-width:110px}
.checkline{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.checkline input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:1px 0 0}
.checkline .hint{display:block}
.eqbox{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.eqbox .det{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding-left:32px}
.eqbox .det .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.eqbox .det .field{max-width:92px;min-height:40px;padding:6px 10px}
.eqbox .det .field.wide{max-width:none}

/* storico */
.hist-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pnav{display:flex;align-items:center;gap:10px;justify-content:space-between}
.pnav h2{font-size:20px;font-weight:800;text-align:center;flex:1;min-width:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wh{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:2px}
.cal .c{aspect-ratio:1/1.05;max-width:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--surface-2);color:var(--ink);min-width:0}
.cal .c .dd{font-size:12px;font-weight:700;opacity:.75}
.cal .c .pp{font-size:clamp(10px,3vw,13px);font-weight:800;font-family:var(--f-display)}
.cal .c.fut{opacity:.4}
.cal .c.today{box-shadow:inset 0 0 0 2.5px var(--ink)}
.cal .c.plan{box-shadow:inset 0 0 0 2px var(--accent)}
.b0{background:var(--h0)!important}
.b1{background:var(--h1)!important}
.b2{background:var(--h2)!important}
.b3{background:var(--h3)!important;color:var(--h-ink)!important}
.b4{background:var(--h4)!important;color:var(--h-ink)!important}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.kpi b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.kpi.acc{background:var(--accent-soft)}
.kpi.acc b{color:var(--accent)}
.chart{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;height:170px;margin-top:22px;border-bottom:1.5px solid var(--line)}
.col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;position:relative;z-index:1}
.col .v{position:absolute;left:0;right:0;text-align:center;bottom:calc(var(--h,0%) + 3px);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.col .bb{width:100%;max-width:44px;border-radius:7px 7px 0 0;height:var(--h,0%);min-height:3px;background:var(--h3)}
.col.nodata .bb{background:transparent;border:1.5px dashed var(--line);border-bottom:0;height:10px}
.col.cur .v{color:var(--accent)}
.xl{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin-top:6px}
.xl span{text-align:center;font-size:12px;color:var(--muted);font-weight:700;overflow:hidden}
.line{width:100%;height:auto;display:block;overflow:visible}
.line .g{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.line .a{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.line .b{fill:none;stroke:var(--rest);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:6 5}
.line .d{fill:var(--accent)}
.line .db{fill:var(--rest)}
.line text{font-size:11px;fill:var(--muted);font-family:var(--f-body)}
.vbar{display:grid;grid-template-columns:minmax(96px,auto) 1fr 52px;gap:10px;align-items:center;font-size:14.5px}
.vbar .bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.vbar .bar b{display:block;height:100%;background:var(--accent);border-radius:99px}
.vbar.low .bar b{background:var(--warn)}
.vbar .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.pr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.pr .t{flex:1;min-width:0;font-weight:700}
.pr b{font-family:var(--f-display);font-size:18px}

/* figure degli esercizi */
.fig{color:var(--accent);display:block}
.fig .p{stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .hd{fill:currentColor}
.fig .gr{stroke:var(--line);stroke-width:2.5;stroke-linecap:round}
.fig .pr{stroke:var(--muted);stroke-width:3;fill:none;stroke-linecap:round;opacity:.7}

/* FAB */

@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-size:22px;font-weight:800;margin-bottom:14px}

.menu{display:flex;flex-direction:column;gap:8px}

.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.scale button{min-height:44px;border-radius:9px;background:var(--surface-2);font-weight:700;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--urgent);color:#fff}

/* schermo intero: allenamento, configurazione, timer */
.full{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.full .in{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.cue b{color:var(--accent)}

.stepper button{height:64px;border-radius:14px;background:var(--surface-2);font-size:32px;font-weight:700;line-height:1}

.feel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.nextbox{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}

.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.big3 button{min-height:64px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:16px;padding:6px}
.big3 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.wfoot{display:flex;gap:8px}
.wfoot .btn{flex:1;min-height:56px}
.wfoot .btn.primary{flex:2}
.steps-dots{display:flex;gap:6px;justify-content:center}
.steps-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.steps-dots i.on{background:var(--accent);width:22px;border-radius:99px}
.wiz h1{font-size:clamp(26px,7vw,34px);font-weight:800;line-height:1.1}
.sumhead{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.sumhead h1{font-size:clamp(30px,8vw,42px);font-weight:800}
.medal{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;animation:pop .8s ease}
.medal svg{width:46px;height:46px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{0%{transform:scale(.3)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.pause{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-weight:700;text-align:center}

.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center}
/* durante l'allenamento i messaggi stanno in alto, per non coprire i pulsanti */
.full:not([hidden]) ~ .toast{bottom:auto;top:calc(70px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* spinta */
X('push-wall',"Flessioni al muro",'spinta',['petto'],['tricipiti','spalle'],[],1,'bw','r',"In piedi davanti al muro, mani all'altezza delle spalle. Porta il petto verso il muro piegando i gomiti e torna indietro spingendo.","Corpo dritto dalla testa ai talloni|Gomiti a 45° dal busto, non spalancati|Spingi il muro lontano da te","Sedere che va indietro|Testa che si allunga in avanti|Movimento troppo corto",null,'push-incl',[],null,'push');
X('push-incl',"Flessioni inclinate",'spinta',['petto'],['tricipiti','spalle'],['chair|bench|table'],2,'bw','r',"Mani sul bordo di un tavolo, di un divano o di una sedia appoggiata al muro. Corpo dritto, scendi con il petto verso il bordo e risali.","Più alto è l'appoggio, più è facile|Pancia e glutei contratti|Scendi finché il petto quasi tocca","Fianchi che cedono|Gomiti spalancati|Sedia che scivola: appoggiala al muro",'push-wall','push-knee',[],null,'push');
X('push-knee',"Flessioni sulle ginocchia",'spinta',['petto'],['tricipiti','spalle'],['mat'],2,'bw','r',"Ginocchia sul tappetino, mani poco più larghe delle spalle. Corpo dritto dalle ginocchia alla testa, scendi con il petto e spingi via il pavimento.","Linea dritta ginocchia-spalle|Mani sotto le spalle|Scendi lento in 2 secondi","Sedere in alto|Testa che cade verso terra|Metà movimento",'push-incl','push',['polsi'],'push-wall','push');
X('push',"Flessioni",'spinta',['petto'],['tricipiti','spalle','core'],[],3,'bw','r',"Mani poco più larghe delle spalle, corpo dritto sulle punte dei piedi. Scendi finché il petto è vicino a terra e risali tutto d'un pezzo.","Stringi glutei e pancia come in un plank|Gomiti a 45°, non a T|Petto vicino a terra a ogni ripetizione","Bacino che cede per primo|Collo piegato in avanti|Ripetizioni a metà",'push-knee','push-decl',['polsi'],'push-incl','push');
X('push-decl',"Flessioni con i piedi rialzati",'spinta',['petto','spalle'],['tricipiti'],['chair|bench|step'],4,'bw','r',"Come una flessione normale, ma con i piedi su una sedia o sul divano. Sposta più lavoro su petto alto e spalle.","Appoggio stabile per i piedi|Corpo dritto, niente schiena a ponte|Scendi controllato","Fianchi che crollano|Rialzo troppo alto all'inizio|Testa che tocca prima del petto",'push','push-pack',['polsi','spalle'],'push-incl','push');
X('push-diam',"Flessioni strette",'spinta',['tricipiti'],['petto','spalle'],[],4,'bw','r',"Flessione con le mani vicine sotto il petto. I gomiti restano lungo i fianchi: lavorano molto i tricipiti.","Gomiti che sfiorano il busto|Mani sotto lo sterno|Scendi piano","Gomiti che si aprono|Polsi doloranti: allarga un po' le mani|Bacino che cede",'push-knee',null,['polsi','spalle'],'push-incl','push');
X('push-pack',"Flessioni con lo zaino",'spinta',['petto'],['tricipiti','spalle'],['pack'],4,'pack','r',"Flessioni con uno zaino pieno sulla schiena, ben stretto. Il peso dello zaino si aumenta con libri o bottiglie.","Spallacci stretti, zaino alto|Stessa tecnica delle flessioni|Aggiungi peso un po' alla volta","Zaino che scivola sulla nuca|Schiena che si inarca|Peso troppo alto subito",'push',null,['polsi','spalle'],'push-incl','push');
X('pike-high',"Pike push-up con le mani sulla sedia",'spinta',['spalle'],['tricipiti'],['chair|bench'],2,'bw','r',"Mani sulla sedia, sedere in alto, corpo a V rovesciata. Piega i gomiti e porta la testa verso il bordo, poi spingi su.","Sedere alto sopra le mani|Testa tra le braccia, non davanti|Gomiti in avanti, non di lato","Corpo dritto come una flessione normale|Gomiti spalancati|Sedia instabile",null,'pike',['spalle'],'push-incl','pike');
X('pike',"Pike push-up",'spinta',['spalle'],['tricipiti'],['mat'],3,'bw','r',"Mani a terra, sedere in alto a V rovesciata. Piega i gomiti portando la testa verso terra davanti alle mani, poi spingi. È la preparazione alla verticale.","Peso sulle mani|Testa che va davanti alle mani|Gambe tese o appena piegate","Schiena tonda|Gomiti di lato|Scendere senza controllo",'pike-high','pike-decl',['spalle','polsi'],'push-incl','pike');
X('pike-decl',"Pike push-up con i piedi rialzati",'spinta',['spalle'],['tricipiti'],['chair|bench|step'],4,'bw','r',"Come il pike push-up, ma con i piedi sulla sedia: il corpo è più verticale e le spalle lavorano di più.","Piedi stabili|Sedere sopra le spalle|Scendi lento","Testa che sbatte|Schiena che si inarca|Rialzo troppo alto",'pike',null,['spalle','polsi','collo'],'pike-high','pike');
X('dip-chair',"Dip alla sedia",'spinta',['tricipiti'],['petto','spalle'],['chair|bench'],2,'bw','r',"Mani sul bordo di una sedia ferma contro il muro, piedi a terra con le ginocchia piegate. Scendi piegando i gomiti e risali.","Spalle basse, lontane dalle orecchie|Gomiti che vanno dietro, non di lato|Scendi solo fin dove non senti fastidio","Sedere lontano dalla sedia|Spalle che salgono|Scendere troppo",null,'dip-chair-str',['spalle','polsi'],'push-diam','dip');
X('dip-chair-str',"Dip alla sedia a gambe tese",'spinta',['tricipiti'],['petto','spalle'],['chair|bench'],3,'bw','r',"Come il dip alla sedia, ma con le gambe tese davanti: il peso sulle braccia aumenta.","Talloni a terra lontani|Busto vicino alla sedia|Movimento controllato","Spalle in avanti|Gomiti aperti|Rimbalzo in basso",'dip-chair',null,['spalle','polsi'],'push-incl','dip');
X('db-floor',"Floor press con manubri",'spinta',['petto'],['tricipiti'],['db','mat'],2,'db','r',"Sdraiato a terra, ginocchia piegate, un manubrio per mano sopra il petto. Scendi finché i gomiti toccano terra e spingi su.","Gomiti a 45° dal busto|Pausa leggera con i gomiti a terra|Polsi dritti sopra i gomiti","Manubri che sbattono|Gomiti a 90° dal corpo|Schiena inarcata",null,'db-bench',[],null,'press');
X('db-bench',"Distensioni con manubri su panca",'spinta',['petto'],['tricipiti','spalle'],['db','bench'],2,'db','r',"Sdraiato sulla panca, piedi a terra, manubri all'altezza del petto. Spingi in alto e torna giù piano.","Scapole strette contro la panca|Scendi in 2-3 secondi|Polsi sopra i gomiti","Rimbalzo sul petto|Sedere che si stacca|Manubri troppo larghi in basso",'db-floor','db-incl',['spalle'],'db-floor','press');
X('db-incl',"Distensioni con manubri su panca inclinata",'spinta',['petto','spalle'],['tricipiti'],['db','incl'],3,'db','r',"Panca inclinata a 30°, spingi i manubri dal petto alto verso l'alto.","Inclinazione bassa, 30° basta|Scapole indietro|Discesa controllata","Inclinazione troppo alta|Gomiti spalancati|Inarcare troppo",'db-bench',null,['spalle'],'db-floor','press');
X('db-press',"Lento avanti con manubri",'spinta',['spalle'],['tricipiti'],['db'],2,'db','r',"Seduto o in piedi, manubri all'altezza delle spalle. Spingi sopra la testa fino a braccia quasi tese e torna giù.","Pancia contratta, niente schiena a ponte|Manubri leggermente davanti alla testa|Giù fino al mento","Inarcare la schiena|Spingere con le gambe|Gomiti dietro il corpo",null,null,['spalle'],'db-lat','ohp');
X('db-lat',"Alzate laterali",'spinta',['spalle'],[],['db'],1,'db','r',"In piedi, manubri leggeri lungo i fianchi. Alza le braccia di lato fino all'altezza delle spalle, gomiti appena piegati.","Peso leggero, conta il controllo|Mignolo appena più alto del pollice|Scendi in 2 secondi","Slancio con il busto|Spalle che salgono alle orecchie|Braccia sopra le spalle",null,null,[],null,'reach');
X('db-tri',"Estensioni dei tricipiti sopra la testa",'spinta',['tricipiti'],[],['db'],2,'db','r',"Tieni un manubrio con due mani sopra la testa. Piega i gomiti portandolo dietro la nuca e risali.","Gomiti che puntano in avanti|Pancia contratta|Movimento solo dei gomiti","Gomiti che si aprono|Schiena inarcata|Peso troppo pesante",null,null,['spalle'],'push-diam','ohp');
X('pack-press',"Spinta sopra la testa con lo zaino",'spinta',['spalle'],['tricipiti'],['pack'],2,'pack','r',"Tieni lo zaino per i lati all'altezza del petto e spingilo sopra la testa, poi riportalo giù.","Pancia e glutei contratti|Zaino ben chiuso e compatto|Braccia quasi tese in alto","Schiena a ponte|Zaino che dondola|Spingere con le gambe",null,null,['spalle','schiena'],'pike-high','ohp');

/* ---------- date ---------- */
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const todayKey=()=>keyOf(new Date());
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const wd=k=>(parseKey(k).getDay()+6)%7;
const wkStart=k=>addDays(k,-wd(k));
const diffDays=(a,b)=>Math.round((parseKey(b)-parseKey(a))/86400000);
const longDate=k=>{const d=parseKey(k);return DLONG[wd(k)]+' '+d.getDate()+' '+MONTHS[d.getMonth()]};
const shortDate=k=>{const d=parseKey(k);return d.getDate()+' '+MSH[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
const weekLabel=mon=>{const a=parseKey(mon),b=parseKey(addDays(mon,6));return a.getDate()+(a.getMonth()!==b.getMonth()?' '+MSH[a.getMonth()]:'')+' – '+b.getDate()+' '+MSH[b.getMonth()]};
function relDay(k){const n=diffDays(todayKey(),k);
  if(n===0)return 'Oggi';if(n===1)return 'Domani';if(n===-1)return 'Ieri';
  return n>0?'tra '+n+' giorni':n*-1+' giorni fa'}
const fmtClock=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+pad(s%60)};
const fmtMin=m=>m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':'');

function defEq(){return {mat:true,chair:true,table:true,towel:true,pack:{on:true,max:10},

function normEq(e){e=obj(e);const d=defEq();const o=(k)=>({...d[k],...obj(e[k])});
  const b=(k)=>typeof e[k]==='boolean'?e[k]:d[k];
  const r={mat:b('mat'),chair:b('chair'),table:b('table'),towel:b('towel'),pack:o('pack'),db:o('db'),bb:o('bb'),
    bench:['none','flat','incl'].includes(e.bench)?e.bench:d.bench,bar:b('bar'),band:o('band'),kb:o('kb'),rings:b('rings'),step:b('step'),rope:b('rope'),bike:b('bike')};
  ['pack','db','bb','band','kb'].forEach(k=>{r[k].on=!!r[k].on});
  r.pack.max=clamp(+r.pack.max||10,1,60);r.db.min=Math.max(0.5,+r.db.min||2);r.db.max=Math.max(r.db.min,+r.db.max||20);r.db.step=Math.max(0.25,+r.db.step||2);r.bb.bar=Math.max(0,+r.bb.bar||0);
  return r}

/* ---------- attrezzi e pesi ---------- */
const P=()=>D.profile;
const EQ=()=>D.profile.eq;
function bands(){return String(EQ().band.list||'').split(',').map(s=>{const m=s.trim().match(/^(.*?)\s*([\d.,]+)\s*(kg)?$/i);return m?{name:m[1].trim()||'elastico',kg:parseNum(m[2])}:null}).filter(b=>b&&isFinite(b.kg)).sort((a,b)=>a.kg-b.kg)}
function has(t){const e=EQ();
  switch(t){case 'mat':return true;case 'chair':return e.chair;case 'table':return e.table;case 'towel':return e.towel;case 'pack':return e.pack.on;
    case 'db':return e.db.on&&dbW().length>0;case 'bb':return e.bb.on;case 'bench':return e.bench!=='none';case 'incl':return e.bench==='incl';case 'bar':return e.bar;
    case 'band':return e.band.on&&bands().length>0;case 'kb':return e.kb.on&&numList(e.kb.list).length>0;default:return !!e[t]}}
const canDo=ex=>arr(ex.eq).every(t=>String(t).split('|').some(has));
function dbW(){const d=EQ().db;if(d.type==='fixed')return uniqSort(numList(d.fixed));const o=[];for(let w=d.min;w<=d.max+1e-9&&o.length<200;w+=d.step)o.push(w);return uniqSort(o)}
function bbW(){const b=EQ().bb;const side=[];String(b.plates||'').split(/[,;]+/).forEach(s=>{const m=s.trim().match(/^(\d+)\s*[x×]\s*([\d.,]+)$/i);if(m){const n=Math.floor(+m[1]/2),kg=parseNum(m[2]);for(let i=0;i<n;i++)side.push(kg)}else{const kg=parseNum(s);if(isFinite(kg))side.push(kg)}});
  let sums=new Set([0]);side.forEach(p=>{const ns=new Set(sums);sums.forEach(s=>ns.add(r2(s+p)));sums=ns});return uniqSort([...sums].map(s=>b.bar+2*s))}
function weightsFor(ld){const e=EQ();
  if(ld==='db')return dbW();if(ld==='kb')return uniqSort(numList(e.kb.list));if(ld==='dk')return uniqSort([...(e.db.on?dbW():[]),...(e.kb.on?numList(e.kb.list):[])]);
  if(ld==='bb')return bbW();if(ld==='pack'){const o=[];for(let i=1;i<=e.pack.max;i++)o.push(i);return o}
  if(ld==='band')return bands().map(b=>b.kg);return []}
function stepW(ld,w,dir){const ws=weightsFor(ld);if(!ws.length)return w;
  if(dir>0){const n=ws.find(x=>x>w+1e-9);return n==null?w:n}const n=ws.slice().reverse().find(x=>x<w-1e-9);return n==null?w:n}
function nearW(ld,w,floor){const ws=weightsFor(ld);if(!ws.length)return 0;if(floor){const f=ws.slice().reverse().find(x=>x<=w+1e-9);return f==null?ws[0]:f}
  return ws.reduce((b,x)=>Math.abs(x-w)<Math.abs(b-w)?x:b,ws[0])}
const loaded=ex=>ex&&ex.ld&&ex.ld!=='bw';
function fmtW(ld,w){if(ld==='band'){const b=bands().find(x=>Math.abs(x.kg-w)<1e-6);return b?'elastico '+b.name:fmtN(w)+' kg'}return fmtN(w)+' kg'}
function firstW(ex){const ws=weightsFor(ex.ld);if(!ws.length)return 0;
  if(ex.ld==='bb')return ws[0];if(ex.ld==='pack')return Math.min(ws[ws.length-1],P().level==='principiante'?3:5);
  const lv={principiante:.15,intermedio:.3,esperto:.45}[P().level];return ws[Math.max(0,Math.floor(ws.length*lv)-1)]||ws[0]}

/* ---------- esercizi ---------- */
const allEx=()=>LIB.concat(D.custom);
const exById=id=>BYID[id]||D.custom.find(e=>e.id===id)||null;
const exName=id=>{const e=exById(id);return e?e.n:'Esercizio'};
const isTime=ex=>ex&&String(ex.u).charAt(0)==='s';
const perSide=ex=>ex&&String(ex.u).charAt(1)==='l';
const unitShort=ex=>isTime(ex)?'s':'rip';
let dayPains=[];/* dolori segnati nel check-in di oggi: valgono solo per questo allenamento */
const curPains=()=>[...new Set(P().pains.concat(dayPains))];
const contraHit=(ex,pains)=>arr(ex.contra).filter(c=>(pains||curPains()).includes(c));
const isSafe=(ex,pains)=>D.allow[ex.id]||(!contraHit(ex,pains).length&&!D.avoid[ex.id]);
const usable=(ex,pains)=>canDo(ex)&&isSafe(ex,pains);
function alternatives(ex,pains,limit){if(!ex)return [];
  const sameM=e=>e.m.some(m=>ex.m.includes(m));
  return allEx().filter(e=>e.id!==ex.id&&usable(e,pains)&&(e.p===ex.p||sameM(e))&&(ex.p==='mobilita'||e.p!=='mobilita'))
    .map(e=>({e,s:(e.p===ex.p?3:0)+(sameM(e)?2:0)-Math.abs(e.d-ex.d)+(D.likes[e.id]===1?1.5:0)+(D.likes[e.id]===-1?-4:0)}))
    .sort((a,b)=>b.s-a.s).slice(0,limit||6).map(x=>x.e)}
/* versione più facile o più difficile realmente fattibile: segue i collegamenti della libreria */
function variant(ex,dir){let cur=ex;for(let i=0;i<4&&cur;i++){const id=dir>0?cur.hard:cur.easy;const n=id&&exById(id);if(!n)return null;if(usable(n))return n;cur=n}return null}

      else{const h=variant(ex,1);if(h){st.ready=h.id;msg='Prova la versione più difficile: '+h.n}else st.r=T.rmax+(isTime(ex)?20:4)}}
    else{st.r=Math.min(T.rmax,Math.max(tgt,minR)+step*(allEasy?2:1));msg='La prossima volta: '+st.r+' '+unitShort(ex)}
    st.easy=allEasy?st.easy+1:0}
  else{st.easy=0;if(hard>=2||minR<T.rmin||!full){st.fails++;
      if(st.fails>=2){if(loaded(ex)&&stepW(ex.ld,w,-1)<w){st.w=stepW(ex.ld,w,-1);msg='La prossima volta un po\' più leggero: '+fmtW(ex.ld,st.w);st.fails=0}
        else{const e=variant(ex,-1);if(e){st.easier=e.id;msg='Ti propongo una versione più facile: '+e.n}}}}}
  D.prog[ex.id]=st;return msg}

const e1rm=(w,r)=>w>0&&r>0?w*(1+r/30):0;
const itemsOf=id=>{const o=[];D.sessions.forEach(s=>s.items.forEach(i=>{if(i.ex===id&&!i.skipped&&i.sets.length)o.push({s,i})}));return o.sort((a,b)=>a.s.date.localeCompare(b.s.date)||a.s.start-b.s.start)};
function bestOf(ex,i){const sets=arr(i.sets);if(loaded(ex))return Math.max(0,...sets.map(s=>e1rm(+s.w,+s.r)));return Math.max(0,...sets.map(s=>+s.r||0))}
function recordOf(id,beforeId){const ex=exById(id);if(!ex)return 0;let b=0;itemsOf(id).forEach(({s,i})=>{if(s.id!==beforeId)b=Math.max(b,bestOf(ex,i))});return b}
function sessPct(s){if(s.kind==='activity'||s.kind==='mobility')return s.kind==='mobility'?.5:.4;return s.planned?Math.min(1,s.done/s.planned):0}
function volumeBy(a,b){const v={};VOLG.forEach(g=>v[g]=0);sessIn(a,b).forEach(s=>s.items.forEach(i=>{const ex=exById(i.ex);if(!ex||i.skipped)return;const n=i.sets.length;
  ex.m.forEach(m=>{if(v[m]!=null)v[m]+=n});arr(ex.s).forEach(m=>{if(v[m]!=null)v[m]+=n/2})}));return v}
function nextSessOf(id){/* quante volte compare l'esercizio negli ultimi allenamenti, quante saltato e com'è andato */
  const rec=[];D.sessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(s=>s.items.forEach(i=>{if(i.ex===id)rec.push(i)}));return rec.slice(0,4)}

function weekStrip(ti){const t=ti.t;const planDates=new Map(ti.pl.map(x=>[x.date,x]));

  for(let i=0;i<7;i++){const k=addDays(ti.week,i);const ss=D.sessions.filter(s=>s.date===k);const pl=planDates.get(k);
    const full=ss.some(s=>s.kind==='full'||s.kind==='short');const light=!full&&ss.length;
    const cls=['wd',k===t?'is-today':'',full?'done':light?'light':pl?(k<t?'miss':'plan'):''].join(' ');
    h+='<button class="'+cls+'" data-act="dayinfo" data-k="'+k+'" aria-label="'+esc(longDate(k))+(pl?', '+esc(pl.day.name):'')+'"><span class="l">'+DSH[i]+'</span><span class="o">'+(ss.length?IC.check:'')+'</span></button>'}

function safetyLine(){return '<p class="safety"><span>L\'app non sostituisce medico o fisioterapista. Con dolore acuto, formicolii o dolore che dura, fermati e fatti vedere.</span><button data-act="safety">Leggi</button></p>'}
function backupOld(){const lb=D.meta.lastBackup;return D.sessions.length>=3&&(!lb||diffDays(lb,todayKey())>14)}
function proof(){let best=null;
  allEx().forEach(ex=>{const it=itemsOf(ex.id);if(it.length<2)return;const a=it[0],b=it[it.length-1];if(diffDays(a.s.date,b.s.date)<6)return;
    const x=bestOf(ex,a.i),y=bestOf(ex,b.i);if(!(x>0&&y>x))return;const g=(y-x)/x;if(!best||g>best.g)best={g,ex,x,y,d:diffDays(a.s.date,b.s.date)}});
  if(!best)return '';const ex=best.ex;const u=loaded(ex)?' kg (massimale stimato)':isTime(ex)?' secondi':' ripetizioni';
  return '<b>'+esc(ex.n)+'</b>: da '+fmtN(Math.round(best.x))+' a '+fmtN(Math.round(best.y))+u+' in '+(best.d<14?best.d+' giorni':Math.round(best.d/7)+' settimane')+'.'}

function insights(){const out=[];if(!D.plan)return out;const t=todayKey();const cur=wkStart(t);

    const done=rec.filter(i=>!i.skipped&&i.sets.length);const hardN=done.filter(i=>i.sets.filter(s=>s.feel===3).length>=2).length;
    const painN=rec.filter(i=>i.pain).length;const easyN=done.filter(i=>i.sets.every(s=>s.feel===1)).length;const skipN=rec.filter(i=>i.skipped&&!i.sore).length;

    else if(hardN>=2||painN||(st.easier&&exById(st.easier))){const e=(st.easier&&exById(st.easier))||variant(ex,-1)||alternatives(ex)[0];

  }));

  const first=D.sessions.reduce((m,s)=>!m||s.date<m?s.date:m,'')||D.plan.createdAt;
  D.plan.days.forEach(d=>{let miss=0,weeks=0;for(let i=1;i<=4;i++){const w=addDays(cur,-7*i);if(w<wkStart(first)||w<wkStart(D.plan.createdAt))continue;weeks++;if(!doneDay(d.id,w))miss++}
    if(weeks>=2&&miss>=2){const used=new Set(D.plan.days.map(x=>x.wd));let alt=null;for(const o of [1,-1,2,-2,3,-3]){const c=(d.wd+o+7)%7;if(!used.has(c)){alt=c;break}}
      const acts=[];if(alt!=null)acts.push(['Spostalo a '+DLONG[alt].toLowerCase(),'ins-moveday',{day:d.id,wd:alt}]);if(P().minutes>20)acts.push(['Sessioni da '+MINUTES[MINUTES.indexOf(P().minutes)-1]+' minuti','ins-shorter',{}]);

  const n14=sessIn(addDays(t,-13),t).filter(s=>s.kind==='full'||s.kind==='short').length;
  if(n14>=3){const v=volumeBy(addDays(t,-13),t);const vals=VOLG.map(g=>v[g]).sort((a,b)=>a-b);const med=vals[Math.floor(vals.length/2)];

  return out.filter(x=>!dismissed(x.id))}

/* suono e schermo acceso. Su iPhone il suono funziona solo dopo un tocco e si "addormenta" quando non suona da un po':
   lo risvegliamo a ogni tocco. Normalmente si mescola alla musica e tace con il silenzioso;
   con l'opzione "anche con il silenzioso" usa la riproduzione multimediale, che suona sempre (ma può fermare la musica). */
let actx=null;const SND={};
const loudSnd=()=>!!D.meta.loudSound;
function wavUrl(tones){const sr=22050;const pcm=[];tones.forEach(([f,d])=>{const n=Math.round(sr*d);for(let i=0;i<n;i++){const env=Math.min(1,i/(sr*.01))*Math.min(1,(n-i)/(sr*.04));pcm.push(f?Math.sin(2*Math.PI*f*i/sr)*env*.7:0)}});
  const buf=new ArrayBuffer(44+pcm.length*2);const v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+pcm.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,'data');v.setUint32(40,pcm.length*2,true);pcm.forEach((s,i)=>v.setInt16(44+i*2,Math.round(s*32767),true));return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}))}
function initSnd(){if(SND.lo)return;try{SND.lo=new Audio(wavUrl([[880,.2]]));SND.hi=new Audio(wavUrl([[1175,.2]]));SND.two=new Audio(wavUrl([[1175,.18],[0,.1],[1175,.18]]));Object.values(SND).forEach(a=>{a.preload='auto'})}catch(e){}}
function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type=loudSnd()?'playback':'auto'}catch(e){}
  try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}if(actx&&actx.state!=='running')actx.resume();
    if(actx){const o=actx.createOscillator(),g=actx.createGain();g.gain.value=0.0001;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.02)}}catch(e){}
  initSnd();if(!SND.ok&&SND.lo){SND.ok=true;['lo','hi','two'].forEach(k=>{const a=SND[k];try{a.muted=true;const p=a.play();if(p)p.then(()=>{a.pause();a.currentTime=0;a.muted=false}).catch(()=>{a.muted=false})}catch(e){a.muted=false}})}}

  if(loudSnd()||!actx){initSnd();const a=SND[k];if(a){try{a.muted=false;a.currentTime=0;const p=a.play();if(p)p.catch(()=>{})}catch(e){}}}
  else try{if(actx.state!=='running')actx.resume();const t0=actx.currentTime+.02;for(let i=0;i<(n||1);i++){const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=hi?1175:880;
    const s=t0+i*.28;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.5,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.22);o.connect(g);g.connect(actx.destination);o.start(s);o.stop(s+.25)}}catch(e){}
  try{if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate(n>1?[180,90,180]:200)}catch(e){}}

function woTick(){const A=D.active;
  if(fullMode==='timer'){timerTick();return}
  if(fullMode!=='wo'||!A)return;const now=Date.now();
  const el=document.querySelector('[data-elapsed]');if(el)el.textContent=fmtClock(now-A.start);
  const C=2*Math.PI*44;const setRing=f=>{const r=document.querySelector('[data-ring]');if(r)r.setAttribute('stroke-dashoffset',(C*(1-clamp(f,0,1))).toFixed(1))};
  const cd=document.querySelector('[data-cd]');
  if(A.phase==='rest'){const left=A.restEnd-now;if(left<=0){endRest(A,true);return}if(cd)cd.textContent=fmtClock(left);setRing(left/A.restTotal);
    if(left<=3200&&left>2800&&!A.pre){A.pre=1;beep(1)}if(left>3200)A.pre=0}
  else if(A.phase==='warm'||A.phase==='cool'){const x=seqList(A)[A.wi];if(!x)return;const ph=A.wPhase||'run';
    if(ph==='ready')return;
    if(ph==='prep'){const pl=A.prepEnd-now;if(pl<=0){beep(1,true);seqRun(A);return}pips(A,pl);if(cd)cd.textContent=String(Math.ceil(pl/1000));setRing(pl/PREP);return}
    if(A.paused)return;const left=A.wEnd-now;if(left<=0){seqNext(A,true);return}
    if(cd)cd.textContent=fmtClock(left);setRing(left/(x.sec*1000));const ex=exById(x.ex);if(perSide(ex)&&!A.half&&left<=x.sec*500){A.half=true;beep(1,true);toast('Cambia lato')}}
  else if(A.phase==='ex'&&A.workPrep){const pl=A.workPrep-now;if(pl<=0){A.workPrep=0;A.workEnd=now+curItem(A).cur.r*1000;beep(1,true);persist();renderWO();return}
    pips(A,pl);if(cd)cd.textContent=String(Math.ceil(pl/1000))}
  else if(A.phase==='ex'&&A.workEnd){const left=A.workEnd-now;if(left<=0){A.workEnd=0;beep(2,true);const it=curItem(A);const ex=exById(it.ex);
      if(perSide(ex)&&!A.side2){A.side2=true;A.pip=0;A.workPrep=Date.now()+PREP;toast('Cambia lato: 5 secondi');persist();renderWO();return}
      A.side2=false;persist();renderWO();toast('Tempo! Com\'è andata?');return}
    if(cd)cd.textContent=fmtClock(left)}}

function plateCombo(perSide){const b=EQ().bb;const side=[];String(b.plates||'').split(/[,;]+/).forEach(s=>{const m=s.trim().match(/^(\d+)\s*[x×]\s*([\d.,]+)$/i);if(m){for(let i=0;i<Math.floor(+m[1]/2);i++)side.push(parseNum(m[2]))}});
  side.sort((a,b)=>b-a);let best={sum:0,list:[]};const go=(i,sum,list)=>{if(sum>perSide+1e-9)return;if(sum>best.sum)best={sum,list:list.slice()};if(i>=side.length)return;list.push(side[i]);go(i+1,sum+side[i],list);list.pop();let j=i;while(j<side.length&&side[j]===side[i])j++;go(j,sum,list)};go(0,0,[]);return best}
function calcOut(){const v=parseNum(($('#calc-in')||{}).value);const o=$('#calc-out');if(!o)return;if(!isFinite(v)||v<=0){o.innerHTML='Scrivi un peso.';return}const e=EQ();let h='';
  if(e.bb.on){const ps=(v-e.bb.bar)/2;if(ps<0)h+='<p><b>Bilanciere:</b> il bilanciere da solo pesa già '+fmtN(e.bb.bar)+' kg.</p>';else{const c=plateCombo(ps);const tot=e.bb.bar+2*c.sum;
    h+='<p><b>Bilanciere:</b> per lato '+(c.list.length?c.list.map(fmtN).join(' + ')+' kg':'niente')+' → totale <b>'+fmtN(tot)+' kg</b>'+(Math.abs(tot-v)>1e-6?' (il più vicino sotto '+fmtN(v)+' kg)':'')+'.</p>'}}
  if(e.db.on){const ws=dbW();const lo=ws.slice().reverse().find(x=>x<=v+1e-9),hi=ws.find(x=>x>=v-1e-9);h+='<p><b>Manubri, per mano:</b> '+(lo!=null&&Math.abs(lo-v)<1e-6?'<b>'+fmtN(lo)+' kg</b>':(lo!=null?fmtN(lo)+' kg':'—')+' oppure '+(hi!=null?fmtN(hi)+' kg':'—'))+'.</p>'}
  if(e.kb.on){const ws=numList(e.kb.list);const n=ws.reduce((b,x)=>Math.abs(x-v)<Math.abs(b-v)?x:b,ws[0]);h+='<p><b>Kettlebell:</b> il più vicino è '+fmtN(n)+' kg.</p>'}
  if(e.pack.on)h+='<p><b>Zaino:</b> metti dentro circa '+fmtN(Math.min(v,e.pack.max))+' kg. Un litro d\'acqua pesa 1 kg, un libro grande circa 1 kg.</p>';
  o.innerHTML=h||'Aggiungi bilanciere, manubri o kettlebell nel profilo per usare il calcolatore.'}

function timerTick(){const t=TM;if(!t||t.paused)return;const left=t.end-Date.now();
  if(left<=0){if(t.ph==='pre'||t.ph==='rest'){if(t.ph==='rest')t.i++;t.ph='work';t.end=Date.now()+t.w*1000;beep(1,true)}
    else{if(t.i>=t.n){beep(3,true);TM=null;closeFull();toast('Timer finito. Ben fatto!');return}if(t.r>0){t.ph='rest';t.end=Date.now()+t.r*1000;beep(2)}else{t.i++;t.end=Date.now()+t.w*1000;beep(1,true)}}
    renderTimer();return}
  if(left<=3200&&left>2900&&!t.pb){t.pb=1;beep(1)}if(left>3200)t.pb=0;
  const cd=document.querySelector('[data-cd]');if(cd)cd.textContent=fmtClock(left);const tot=(t.ph==='work'?t.w:t.ph==='rest'?t.r:5)*1000;const r=document.querySelector('[data-ring]');if(r){const C=2*Math.PI*44;r.setAttribute('stroke-dashoffset',(C*(1-clamp(left/tot,0,1))).toFixed(1))}}
async function shareFile(name,text,type,title){let file;try{file=new File([text],name,{type})}catch(e){file=new Blob([text],{type})}

  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true}

  if(perm&&it.slotId){const x=slotOf(it.slotId);if(x)setSlotEx(x.s,id)}
  const slot=(it.slotId&&slotOf(it.slotId))?slotOf(it.slotId).s:{id:'',...presc(ex)};
  const ni=itemFor(ex,perm?slot:{id:it.slotId,...presc(ex)},{light:it.light||A.kind==='short'});ni.swappedFrom=it.ex;ni.target.sets=Math.max(1,it.target.sets-it.sets.length);if(A.kind==='short')ni.target.rest=30;
  if(it.sets.length){it.target.sets=it.sets.length;A.items.splice(A.i+1,0,ni);enterEx(A,A.i+1)}else{A.items[A.i]=ni;enterEx(A,A.i)}
  persist();renderWO()}

(function boot(){
  const h=(location.hash||'').slice(1);let saved=null;try{saved=localStorage.getItem('al-tab')}catch(e){}
  S.tab=TABS.includes(h)?h:TABS.includes(saved)?saved:'oggi';

  if(D.plan&&(+D.meta.rules||1)<2){const old=D.plan;const np=genPlan();
    if(np.days.length===old.days.length)np.days.forEach((d,i)=>{d.id=old.days[i].id;d.wd=old.days[i].wd});np.moves=old.moves;D.plan=np;D.meta.rulesNote=1}
  D.meta.rules=2;
  rollBlock();persist();render();
  if(D.active){const A=D.active;if(A.phase==='checkin'){dayPains=arr(A.checkin.where)}else if(A.checkin&&A.checkin.where)dayPains=arr(A.checkin.where);
    if(A.phase==='warm'||A.phase==='cool'){if(A.wPhase==='prep')seqReady(A);else if(A.wPhase!=='ready'&&!A.paused){const L=seqList(A);const x=L[A.wi];A.paused=true;A.wLeft=x?clamp(A.wEnd-Date.now(),5000,x.sec*1000):5000}}
    if(A.phase==='ex'){A.workPrep=0;A.workEnd=0;A.side2=false}
    if(diffDays(A.date,todayKey())<=1){openFull('wo');renderWO()}}
  else if(!P().done)openSetup();
  let storageWorks=true;try{localStorage.setItem('al-test','1');localStorage.removeItem('al-test')}catch(e){storageWorks=false}
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
  let tipSeen=false;try{tipSeen=localStorage.getItem('al-tip')==='1'}catch(e){}
  const b=$('#banner');
  if(!storageWorks){b.innerHTML='<span>Questo browser non permette di salvare: le modifiche restano solo finché la pagina è aperta. Se sei in navigazione privata, aprila in una finestra normale.</span>';b.hidden=false}
  else if(ios&&!standalone&&!tipSeen){b.innerHTML='<span><b>Per non perdere i dati:</b> tocca Condividi → "Aggiungi alla schermata Home" e usa l\'app sempre da quell\'icona. Safari e l\'icona tengono memorie separate.</span><button data-act="dismiss-tip" aria-label="Chiudi avviso">OK</button>';b.hidden=false}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
})();
</script>
